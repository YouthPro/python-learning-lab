random_state: 42
test_size: 0.2
cv_folds: 3
regression:
  input: datasets/generated/housing.csv
  grids:
    linear:
      model__fit_intercept: [true, false]
    random_forest:
      model__n_estimators: [40]
      model__max_depth: [null, 8]
    gradient_boosting:
      model__n_estimators: [40]
      model__learning_rate: [0.05, 0.1]
classification:
  input: datasets/generated/classification.csv
  grids:
    logistic:
      model__C: [0.5, 1.0]
    random_forest:
      model__n_estimators: [40]
      model__max_depth: [null, 8]
    svm:
      model__C: [0.5, 1.0]
      model__kernel: [rbf]
