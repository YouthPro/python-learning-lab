[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leetcode-data-structures-python"
version = "0.1.0"
description = "LeetCode data structure practice stubs for Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["common", "sections", "sections.*"]
namespaces = true

[tool.ruff]
target-version = "py311"
line-length = 79

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
