[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-learning-lab"
version = "0.1.0"
description = "Python 编程、数据处理与机器学习实战学习仓库"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "matplotlib>=3.8,<4", "scikit-learn>=1.4,<2", "Pillow>=10,<13", "joblib>=1.3,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]
notebook = ["jupyterlab>=4,<5"]

[tool.setuptools.packages.find]
include = ["phase1_python_programming*", "phase2_data_science*", "dataset_inspector*"]
namespaces = true
exclude = ["*.tests*"]

[tool.setuptools.package-data]
"phase1_python_programming.section01_data_structures.projects.text_analyzer" = ["data/sample.txt"]
"phase1_python_programming.section02_python_engineering.projects.dataset_inspector" = ["examples/*.csv", "examples/*.json"]
"phase2_data_science.section06_sklearn.projects.machine_learning_workflow" = ["configs/config.yaml"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -rfE"
testpaths = ["phase1_python_programming", "phase2_data_science", "tests"]
markers = ["exercise: learner implementation contracts"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
